apiVersion: v1
kind: Namespace
metadata:
  name: loan
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-api
  namespace: loan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loan-api
  template:
    metadata:
      labels:
        app: loan-api
    spec:
      containers:
        - name: loan-api
          image: ghcr.io/onlygibson/loan-api:cfd113a1bd5a8b2d34e1720211abcc939ded8235
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loan-api
  namespace: loan
spec:
  selector:
    app: loan-api
  ports:
    - port: 80
      targetPort: 8000